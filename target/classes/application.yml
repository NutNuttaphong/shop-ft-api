server:
  port: 8080

spring:
  application:
    name: sabaidee-market-api
  profiles:
    active: dev
  config:
    import: optional:file:.env[.properties]

logging:
  level:
    root: INFO
    org.springframework: WARN
    org.mongodb.driver: WARN
    de.flapdoodle: WARN

app:
  jwt:
    secret: sabaidee-market-secret-key-2024-very-long-and-secure-key-minimum-256-bits
    expiration-ms: 86400000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

---
spring:
  config:
    activate:
      on-profile: dev
  data:
    mongodb:
      uri: mongodb://localhost:27017/sabaidee_market

de:
  flapdoodle:
    mongodb:
      embedded:
        version: 4.4.18

---
spring:
  config:
    activate:
      on-profile: prod
  autoconfigure:
    exclude:
      - de.flapdoodle.embed.mongo.spring.autoconfigure.EmbeddedMongoAutoConfiguration
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://acela.proxy.rlwy.net:20120/sabaidee_market}

