server:
  port: 8080

spring:
  application:
    name: sabaidee-market-api
  data:
    mongodb:
      uri: mongodb://localhost:27017/sabaidee_market

app:
  jwt:
    secret: sabaidee-market-secret-key-2024-very-long-and-secure-key-minimum-256-bits
    expiration-ms: 86400000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
