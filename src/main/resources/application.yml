server:
  port: 8080

spring:
  application:
    name: sabaidee-market-api
  data:
    mongodb:
      uri: mongodb://localhost:27017/sabaidee_market

logging:
  level:
    root: INFO
    org.springframework: WARN
    org.mongodb.driver: WARN
    de.flapdoodle: WARN

app:
  jwt:
    secret: sabaidee-market-secret-key-2024-very-long-and-secure-key-minimum-256-bits
    expiration-ms: 86400000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

de:
  flapdoodle:
    mongodb:
      embedded:
        version: 4.4.18

